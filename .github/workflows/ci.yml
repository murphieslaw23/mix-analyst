name: CI Matrix & Production Build Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install ruff 'mypy==1.10.1' pytest pytest-cov
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt

      - name: Run Ruff Lint & Format Verification
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy Typecheck
        run: |
          cd api
          mypy app

      - name: Install Frontend Dependencies & Typecheck
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run build

  test-suite:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Test Dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install pytest pytest-cov psutil 'httpx>=0.28,<1'

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run Pipeline Benchmark Verification
        run: |
          python -m tests.benchmarks.benchmark_pipeline

  playwright-e2e:
    name: Frontend Playwright E2E Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install Dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright E2E Tests
        run: |
          cd web
          pnpm run test:e2e

      - name: Run Production PWA Lifecycle Tests
        run: |
          cd web
          pnpm run test:pwa

      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker-build:
    name: Multi-Stage Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: syco23/mix-analyst-api:latest

      - name: Build Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: worker/Dockerfile
          push: false
          tags: syco23/mix-analyst-worker:latest

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: web/Dockerfile
          push: false
          tags: syco23/mix-analyst-web:latest
