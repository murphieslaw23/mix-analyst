version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mix-analyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mixuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mixpassword}
      POSTGRES_DB: ${POSTGRES_DB:-mixanalyst}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mixuser} -d ${POSTGRES_DB:-mixanalyst}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mix-network

  redis:
    image: redis:7-alpine
    container_name: mix-analyst-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mix-network

  api:
    build:
      context: .
      file: api/Dockerfile
    container_name: mix-analyst-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mixuser}:${POSTGRES_PASSWORD:-mixpassword}@postgres:5432/${POSTGRES_DB:-mixanalyst}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /storage
      MAX_CHUNK_SIZE_BYTES: ${MAX_CHUNK_SIZE_BYTES:-8388608}
      UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
      CORS_ORIGINS: '["http://localhost", "http://localhost:3000", "http://localhost:80", "https://syco23.org"]'
    volumes:
      - storage_data:/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mix-network

  worker:
    build:
      context: .
      file: worker/Dockerfile
    container_name: mix-analyst-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mixuser}:${POSTGRES_PASSWORD:-mixpassword}@postgres:5432/${POSTGRES_DB:-mixanalyst}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /storage
      MAX_CHUNK_SIZE_BYTES: ${MAX_CHUNK_SIZE_BYTES:-8388608}
      UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mix-network

  web:
    build:
      context: ./web
      file: web/Dockerfile
    container_name: mix-analyst-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - mix-network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  mix-network:
    driver: bridge
