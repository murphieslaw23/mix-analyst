services:
  rpi-redis:
    image: redis:7-alpine
    container_name: syco-rpi-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 64m
    mem_reservation: 32m

  rpi-api:
    build:
      # Repo-root context: Dockerfiles address api//worker//tests/ relatively.
      context: .
      dockerfile: api/Dockerfile
    container_name: syco-rpi-api
    restart: unless-stopped
    environment:
      # Names must match api/app/config.py Settings (unknown names are ignored,
      # so the previous STORAGE_PATH/CORS_ORIGINS/DEMUCS_* entries had no effect).
      - DATABASE_URL=sqlite:////app/storage/mixanalyst.db
      - REDIS_URL=redis://rpi-redis:6379/0
      - CELERY_BROKER_URL=redis://rpi-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://rpi-redis:6379/0
      - STORAGE_ROOT=/app/storage
      - ALLOWED_ORIGINS=https://mix-analyzer-system-corrupt.vercel.app,http://localhost:3000
    volumes:
      - ./storage:/app/storage
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - rpi-redis
    mem_limit: 180m
    mem_reservation: 90m

  rpi-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: syco-rpi-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/storage/mixanalyst.db
      - REDIS_URL=redis://rpi-redis:6379/0
      - CELERY_BROKER_URL=redis://rpi-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://rpi-redis:6379/0
      - STORAGE_ROOT=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      - rpi-redis
    # Module path matches the image layout (/app/worker/celery_app.py) and the
    # queues the API dispatches to (see worker/celery_app.py task_routes).
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--max-memory-per-child=256000", "-Q", "analysis,mastering,stems,exports"]
    mem_limit: 380m
    mem_reservation: 150m
