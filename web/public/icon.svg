<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  
  <!-- Outer Monolith Plate -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#262934" stroke-width="6" />
  
  <!-- Industrial Bolts -->
  <circle cx="48" cy="48" r="10" fill="#3f4454" />
  <circle cx="464" cy="48" r="10" fill="#3f4454" />
  <circle cx="48" cy="464" r="10" fill="#3f4454" />
  <circle cx="464" cy="464" r="10" fill="#3f4454" />

  <!-- Center Speaker Totem Cone -->
  <circle cx="256" cy="256" r="160" fill="#121318" stroke="url(#rustGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="110" fill="#191c24" stroke="#2d313f" stroke-width="6" />
  <circle cx="256" cy="256" r="60" fill="url(#rustGrad)" />
  <circle cx="256" cy="256" r="28" fill="#0c0d10" />

  <!-- Sound-System Subwoofer Grills -->
  <line x1="130" y1="256" x2="382" y2="256" stroke="#0f766e" stroke-width="4" stroke-dasharray="12, 8" />
  <line x1="256" y1="130" x2="256" y2="382" stroke="#0f766e" stroke-width="4" stroke-dasharray="12, 8" />
  
  <!-- Totem Frequency Wave Bars -->
  <rect x="96" y="240" width="12" height="32" rx="4" fill="#f97316" />
  <rect x="72" y="248" width="10" height="16" rx="3" fill="#ea580c" />
  <rect x="404" y="240" width="12" height="32" rx="4" fill="#f97316" />
  <rect x="430" y="248" width="10" height="16" rx="3" fill="#ea580c" />

  <!-- SYCO 23 Brand Runes -->
  <text x="256" y="440" font-family="'Chakra Petch', sans-serif" font-weight="900" font-size="34" fill="#ea580c" text-anchor="middle" letter-spacing="6">SYCO23</text>
  <text x="256" y="96" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#5eead4" text-anchor="middle" letter-spacing="8">SYSTEM CORRUPT</text>
</svg>
