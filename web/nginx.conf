server {
    listen 80;
    server_name _;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # The edge ingress owns the canonical /api proxy. Keeping this internal
    # runtime static-only prevents an accidentally published web container
    # from becoming a second, divergent API entrypoint.
    location ^~ /api/ {
        return 404;
    }

    location ~* \.(?:css|js|mjs|woff2?|png|svg|webp|avif)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static UI and deep-link fallback. API, uploads, streams, and downloads
    # never reach this fallback because Caddy routes /api before this proxy.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
